# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

modId=makeexcuse
modName=MakeExcuse
modVersion=1.0.1
modJavaVersion=21
modAuthor=b4n9z
modCredits=Created by b4n9z
modDescription=A client-side PvP utility mod providing an instant TCP drop alibi ('Connection reset by peer' / 'Timed out').
modHomepage=https://b4n9z.github.io

# Required for ForgeGradle to put mods.toml in the right place so it can find our mod.
net.minecraftforge.gradle.merge-source-sets=true

forgeMcVersion=1.21.11
forgeVersion=61.0.1
forgeLoaderVersion=[59,)
forgeEventBusValidatorVersion=7.0-beta.7

neoMcVersion=1.21.11
neoVersion=21.11.3-beta
neoLoaderVersion=[4,)

